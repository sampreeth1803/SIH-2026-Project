services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./videos:/app/videos:ro
      - ./output:/app/output
      - ./yolo11n.pt:/app/yolo11n.pt:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
